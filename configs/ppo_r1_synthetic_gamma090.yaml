# 06-3 비교 실험: 할인율만 0.99 → 0.90 (가까운 보상 위주, 약 10일 시야)
name: ppo_r1_synthetic_gamma090
mode: R1
data:
  root: data/synthetic
  synthetic: true
  train: [2020, 2023]
  test: [2024, 2025]
reward:
  scale: 100.0
ppo:
  learning_rate: 0.0003
  n_steps: 1024
  batch_size: 256
  n_epochs: 10
  gamma: 0.90
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  net_arch: [64, 64]
train:
  total_timesteps: 200000
  eval_every: 10000
  seeds: [0, 1, 2]
