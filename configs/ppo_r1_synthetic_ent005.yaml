# 06-3 비교 실험: 엔트로피 계수만 0.01 → 0.05 (탐험을 더 오래 유지)
name: ppo_r1_synthetic_ent005
mode: R1
data:
  root: data/synthetic
  synthetic: true
  train: [2020, 2023]
  test: [2024, 2025]
reward:
  scale: 100.0
ppo:
  learning_rate: 0.0003
  n_steps: 1024
  batch_size: 256
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.05
  net_arch: [64, 64]
train:
  total_timesteps: 200000
  eval_every: 10000
  seeds: [0, 1, 2]
